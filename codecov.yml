codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: '90...100'
  status:
    project:
      default:
        target: 100%
        threshold: 0.5%
        if_ci_failed: error
    patch:
      default:
        target: 100%
        threshold: 0.5%

# The CLI shim has a subprocess test; its version writer stays in coverage.
ignore:
  - 'dist/**/*'
  - 'demo/**/*'
  - 'test/**/*'
  - 'scripts/set-version.ts'
  - '*.config.*'

comment:
  layout: 'reach, diff, flags, files'
  behavior: default
  require_changes: false
