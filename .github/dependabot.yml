version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ['*']

  # The ecosystem identifier describes the registry; all commands use Bun.
  - package-ecosystem: npm
    directories: ['/', '/demo']
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        patterns: ['*']
    ignore:
      - dependency-name: react
      - dependency-name: react-native
      - dependency-name: react-native-reanimated
      - dependency-name: expo
      - dependency-name: '@legendapp/list'
      # nativewind 4.2.x's Babel preset requires react-native-worklets/plugin,
      # which ships with Reanimated 4; the demo pins Reanimated 3.19.
      - dependency-name: nativewind
        versions: ['>=4.2.0']
      - dependency-name: babel-preset-expo
      - dependency-name: 'expo-*'
      - dependency-name: react-native-safe-area-context
      - dependency-name: react-dom
      - dependency-name: react-test-renderer
      - dependency-name: react-native-screens
      - dependency-name: '@expo/*'
      - dependency-name: rrule-temporal
        update-types: ['version-update:semver-major']
