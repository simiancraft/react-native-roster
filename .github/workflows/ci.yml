name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default for the whole workflow; the `release` job
# overrides with a broader block for semantic-release to push tags.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.1
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Biome check
        run: bun run lint

      - name: Typecheck (tsgo)
        run: bun run typecheck

      - name: Typecheck tests (tsgo)
        run: bun run typecheck:test

      - name: React Compiler safety (eslint react-compiler rule on library components)
        run: bun run check:react-compiler

      - name: Build library
        run: bun run build

      - name: Typecheck demo (tsgo)
        run: bun run typecheck:demo

      - name: Export demo web
        working-directory: ./demo
        run: bunx expo export -p web

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Web performance budget
        run: bun run check:web

      - name: Package size budget
        run: bun run check:size

      - name: Package hygiene (publint)
        run: bun run check:package

      - name: Dead code (knip)
        run: bun run check:knip

      - name: Test with coverage
        run: bun test --coverage --coverage-reporter=lcov

      - name: Upload coverage reports to Codecov
        if: >
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  release:
    name: Release
    # Configure a required reviewer for this environment before enabling releases.
    # Approve only against issue #9 device evidence for this exact commit.
    environment: release
    needs: check
    # Opt-in gate: set repo variable RELEASE_ENABLED=true and configure the
    # APP_ID / APP_PRIVATE_KEY secrets before flipping this on. Skipped by
    # default so CI stays green on a pre-publish tree.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.1
        with:
          bun-version: '1.4.0'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # npm publishes with --provenance; Bun 1.4.0 emits no attestation.
          registry-url: https://registry.npmjs.org

      # npm authenticates through the trusted publisher registered on npmjs.com
      # for this repository, workflow file, and environment (OIDC; no NPM_TOKEN).
      # Node 22 bundles npm 10; the OIDC exchange needs npm 11.5.1 or newer.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # @semantic-release/git makes the `chore(release)` commit; the lefthook
          # pre-commit dev gate must not run in release automation (it assumes a
          # full dev install, e.g. the demo's deps). Disable lefthook for this step.
          LEFTHOOK: '0'
        run: bunx semantic-release
